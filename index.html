<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWEET MART</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    body{overflow-x:hidden}
    button,input,textarea{font-family:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{width:100%;max-width:600px;min-height:100vh;margin:0 auto;background:#fff;position:relative}
    .page{display:none;width:100%;min-height:100vh;background:#fff}
    .page.active{display:block}
    .header{background:#0b5ed7;color:#fff;padding:18px 16px}
    .brand{font-size:24px;font-weight:bold}
    .tagline{font-size:13px;margin-top:4px;opacity:.9}
    .search-area{padding:14px 16px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #e5e7eb}
    .search{width:100%;padding:13px 15px;border:1px solid #d5d9e2;border-radius:12px;font-size:15px;outline:none;background:#fff;color:#111827}
    .search::placeholder{color:#6b7280}
    .search:focus{border-color:#0b5ed7}
    .categories{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;scrollbar-width:none}
    .categories::-webkit-scrollbar{display:none}
    .category{flex-shrink:0;border:1px solid #dce1ea;background:#fff;color:#172033;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
    .category.active{background:#0b5ed7;color:#fff;border-color:#0b5ed7}
    .content{padding:16px;padding-bottom:90px}
    .section-title{font-size:18px;font-weight:bold;margin-bottom:12px}
    .products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .product{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:#fff}
    .product-image{width:100%;height:170px;object-fit:contain;background:#f8f9fb;display:block}
    .product-info{padding:11px}
    .product-name{font-size:14px;font-weight:600;line-height:1.35;min-height:38px;color:#172033}
    .price{margin-top:8px;font-size:17px;font-weight:bold;color:#0b5ed7}
    .stock{margin-top:5px;font-size:12px;color:#198754}
    .stock.out{color:#dc3545}
    .add-button{width:100%;margin-top:10px;border:none;background:#0b5ed7;color:#fff;padding:10px;border-radius:9px;font-size:13px;font-weight:bold;cursor:pointer}
    .add-button:disabled{cursor:not-allowed;opacity:.5}
    .cart-button{position:fixed;right:18px;bottom:18px;background:#198754;color:#fff;border:none;border-radius:50px;padding:14px 18px;font-weight:bold;box-shadow:0 5px 18px rgba(0,0,0,.18);cursor:pointer;display:none;z-index:100}
    .empty{text-align:center;padding:40px 20px;color:#6b7280;font-size:14px}
    .page-header{display:flex;align-items:center;gap:12px;padding:15px 16px;background:#fff;color:#111827;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:20}
    .page-back{flex-shrink:0;border:none;background:#f1f3f5;color:#111827;border-radius:9px;padding:9px 12px;font-size:14px;font-weight:bold;cursor:pointer}
    .page-title{font-size:18px;font-weight:bold}
    .cart-content{padding:16px;padding-bottom:170px}
    .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #e5e7eb}
    .cart-item-image{width:78px;height:78px;object-fit:contain;border-radius:10px;background:#f8f9fb;flex-shrink:0}
    .cart-item-info{flex:1;min-width:0}
    .cart-item-name{font-size:14px;font-weight:600;line-height:1.35;color:#111827}
    .cart-item-price{margin-top:5px;font-size:14px;color:#0b5ed7;font-weight:bold}
    .quantity-controls{display:flex;align-items:center;gap:10px;margin-top:9px}
    .quantity-controls button{border:1px solid #d5d9e2;background:#fff;color:#111827;border-radius:7px;width:30px;height:30px;font-size:17px;cursor:pointer}
    .quantity-controls span{min-width:20px;text-align:center;font-weight:bold;color:#111827}
    .remove-button{margin-top:8px;border:none;background:transparent;color:#dc3545;padding:0;font-size:12px;cursor:pointer}
    .cart-footer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:600px;background:#fff;padding:16px;border-top:1px solid #e5e7eb;z-index:30}
    .cart-total{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:#111827;margin-bottom:12px}
    .checkout-button{width:100%;border:none;background:#198754;color:#fff;padding:14px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
    .checkout-content{padding:16px 16px 30px}
    .form-group{margin-bottom:17px}
    .form-label{display:block;margin-bottom:6px;color:#111827;font-size:14px;font-weight:600}
    .form-input,.form-textarea{width:100%;border:1px solid #d5d9e2;border-radius:9px;padding:12px;background:#fff;color:#111827;font-size:14px;outline:none}
    .form-input:focus,.form-textarea:focus{border-color:#0b5ed7}
    .form-input::placeholder,.form-textarea::placeholder{color:#6b7280}
    .form-textarea{resize:vertical;min-height:90px}
    .place-order-button{width:100%;border:none;background:#0b5ed7;color:#fff;padding:14px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:4px}
    .place-order-button:disabled{opacity:.7;cursor:not-allowed}
    .success-content{padding:28px 16px;text-align:center}
    .success-icon{font-size:58px;margin-bottom:12px}
    .success-title{margin:0 0 8px;color:#111827;font-size:25px}
    .success-text{color:#4b5563;font-size:14px;line-height:1.5;margin:0 0 24px}
    .success-box{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:18px;text-align:left;margin-bottom:20px}
    .success-row{margin-bottom:14px}
    .success-row:last-child{margin-bottom:0}
    .success-label{display:block;color:#111827;font-size:13px;font-weight:bold;margin-bottom:4px}
    .success-value{color:#111827;font-size:15px;font-weight:600}
    .success-order-id{color:#0b5ed7;font-size:16px;font-weight:bold}
    .status-pending{color:#d97706;font-weight:bold}
    .status-unpaid{color:#dc3545;font-weight:bold}
    .continue-button{width:100%;border:none;background:#0b5ed7;color:#fff;padding:14px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
    @media (max-width:380px){.products{grid-template-columns:1fr}.product-image{height:200px}}
  </style>
</head>
<body>
<div class="app">

  <section id="shopPage" class="page active">
    <header class="header">
      <div class="brand">SWEET MART</div>
      <div class="tagline">Shop with ease. Get it delivered.</div>
    </header>
    <div class="search-area">
      <input type="search" id="searchInput" class="search" placeholder="Search products..." autocomplete="off">
    </div>
    <div class="categories">
      <button class="category active" type="button">All</button>
      <button class="category" type="button">Earphones</button>
      <button class="category" type="button">Power Banks</button>
      <button class="category" type="button">Phones & Tablets</button>
      <button class="category" type="button">Fashion</button>
    </div>
    <main class="content">
      <div class="section-title">Featured Products</div>
      <div id="products" class="products"><div class="empty">Loading products...</div></div>
    </main>
    <button id="cartButton" class="cart-button" type="button">🛒 Cart (0)</button>
  </section>

  <section id="cartPage" class="page">
    <div class="page-header">
      <button id="closeCart" class="page-back" type="button">← Shop</button>
      <div class="page-title">Your Cart</div>
    </div>
    <div class="cart-content"><div id="cartItems" class="cart-items"></div></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total:</span><strong id="cartTotal">GH₵0.00</strong></div>
      <button id="checkoutButton" class="checkout-button" type="button">Proceed to Checkout</button>
    </div>
  </section>

  <section id="checkoutPage" class="page">
    <div class="page-header">
      <button id="closeCheckout" class="page-back" type="button">← Cart</button>
      <div class="page-title">Checkout</div>
    </div>
    <div class="checkout-content">
      <div class="form-group">
        <label class="form-label" for="customerName">Full Name</label>
        <input id="customerName" class="form-input" type="text" placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label class="form-label" for="customerPhone">Phone Number</label>
        <input id="customerPhone" class="form-input" type="tel" placeholder="e.g. 024 000 0000">
      </div>
      <div class="form-group">
        <label class="form-label" for="deliveryAddress">Delivery Location / Address</label>
        <textarea id="deliveryAddress" class="form-textarea" placeholder="Enter your delivery location or address"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="orderNotes">Order Notes (Optional)</label>
        <textarea id="orderNotes" class="form-textarea" placeholder="Any special instructions?"></textarea>
      </div>
      <button id="placeOrderButton" class="place-order-button" type="button">Place Order</button>
    </div>
  </section>

  <section id="successPage" class="page">
    <div class="page-header"><div class="page-title">Order Confirmed</div></div>
    <div class="success-content">
      <div class="success-icon">✅</div>
      <h2 class="success-title">Thank You!</h2>
      <p class="success-text">Your order has been received successfully.</p>
      <div class="success-box">
        <div class="success-row">
          <span class="success-label">Order ID</span>
          <div id="successOrderId" class="success-order-id"></div>
        </div>
        <div class="success-row">
          <span class="success-label">Total Amount</span>
          <div id="successOrderTotal" class="success-value"></div>
        </div>
        <div class="success-row">
          <span class="success-label">Order Status</span>
          <div class="status-pending">PENDING</div>
        </div>
        <div class="success-row">
          <span class="success-label">Payment Status</span>
          <div class="status-unpaid">UNPAID</div>
        </div>
      </div>
      <button id="continueShoppingButton" class="continue-button" type="button">Continue Shopping</button>
    </div>
  </section>
</div>

<script>
  let allProducts = [];
  let selectedCategory = "All";
  let cart = [];
  let currentPage = "shopPage";

  function tgReady() {
    try {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        if (Telegram.WebApp.BackButton) {
          Telegram.WebApp.BackButton.onClick(goBack);
        }
      }
    } catch (e) {
      console.log("Telegram initialization skipped.", e);
    }
  }

  function updateTelegramBackButton() {
    try {
      if (!(window.Telegram && Telegram.WebApp && Telegram.WebApp.BackButton)) return;
      if (currentPage === "shopPage") Telegram.WebApp.BackButton.hide();
      else Telegram.WebApp.BackButton.show();
    } catch (e) {
      console.log("Telegram BackButton unavailable.", e);
    }
  }

  function setPage(pageId) {
    document.querySelectorAll(".page").forEach(function(page) {
      page.classList.remove("active");
    });
    const target = document.getElementById(pageId);
    if (!target) return;
    target.classList.add("active");
    currentPage = pageId;
    updateTelegramBackButton();
    updateCartCount();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function showPage(pageId) {
    if (pageId === currentPage) return;
    history.pushState({pageId:pageId}, "", "#" + pageId);
    setPage(pageId);
  }

  function goBack() {
    if (currentPage !== "shopPage") {
      history.back();
      return;
    }
    try {
      if (window.Telegram && Telegram.WebApp) Telegram.WebApp.close();
    } catch (e) {}
  }

  window.addEventListener("popstate", function(event) {
    setPage(event.state && event.state.pageId ? event.state.pageId : "shopPage");
  });

  history.replaceState({pageId:"shopPage"}, "", "#shopPage");

  async function loadProducts() {
    try {
      const response = await fetch("/api?action=products", {method:"GET"});
      if (!response.ok) throw new Error("HTTP " + response.status);
      const result = await response.json();
      if (!result.success) throw new Error(result.error || "Unable to load products.");
      allProducts = Array.isArray(result.data) ? result.data : [];
      displayProducts(allProducts);
      updateCartCount();
    } catch (error) {
      console.error("Product loading error:", error);
      document.getElementById("products").innerHTML =
        '<div class="empty">Unable to load products.</div>';
    }
  }

  function displayProducts(products) {
    const container = document.getElementById("products");
    if (!Array.isArray(products) || products.length === 0) {
      container.innerHTML = '<div class="empty">No products available.</div>';
      return;
    }
    container.innerHTML = "";
    products.forEach(function(product) {
      const card = document.createElement("div");
      card.className = "product";
      const image = document.createElement("img");
      image.className = "product-image";
      image.src = product.imageUrl || "";
      image.alt = product.productName || "Product";
      const info = document.createElement("div");
      info.className = "product-info";
      const name = document.createElement("div");
      name.className = "product-name";
      name.textContent = product.productName || "";
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = "GH₵" + Number(product.sellingPrice || 0).toFixed(2);
      const stock = document.createElement("div");
      stock.className = "stock";
      const stockStatus = String(product.stockStatus || "").toUpperCase();
      const out = stockStatus.includes("OUT");
      stock.textContent = out ? "✕ Out of stock" : "✓ In stock";
      if (out) stock.classList.add("out");
      const button = document.createElement("button");
      button.className = "add-button";
      button.type = "button";
      button.textContent = out ? "Out of Stock" : "Add to Cart";
      button.disabled = out;
      if (!out) button.addEventListener("click", function(){ addToCart(product); });
      info.appendChild(name);
      info.appendChild(price);
      info.appendChild(stock);
      info.appendChild(button);
      card.appendChild(image);
      card.appendChild(info);
      container.appendChild(card);
    });
  }

  function addToCart(product) {
    const productId = String(product.productId || "").trim();
    if (!productId) return;
    const existing = cart.find(function(item) {
      return String(item.product.productId || "").trim() === productId;
    });
    if (existing) existing.quantity = Number(existing.quantity || 0) + 1;
    else cart.push({product:product, quantity:1});
    updateCartCount();
  }

  function updateCartCount() {
    const totalItems = cart.reduce(function(sum, item) {
      return sum + Number(item.quantity || 0);
    }, 0);
    const btn = document.getElementById("cartButton");
    btn.textContent = "🛒 Cart (" + totalItems + ")";
    btn.style.display = totalItems > 0 && currentPage === "shopPage" ? "block" : "none";
  }

  document.getElementById("cartButton").addEventListener("click", function() {
    renderCart();
    showPage("cartPage");
  });

  document.getElementById("closeCart").addEventListener("click", goBack);

  function renderCart() {
    const container = document.getElementById("cartItems");
    container.innerHTML = "";
    if (cart.length === 0) {
      container.innerHTML = '<div class="empty">Your cart is empty.</div>';
      document.getElementById("cartTotal").textContent = "GH₵0.00";
      return;
    }
    let total = 0;
    cart.forEach(function(item, index) {
      const product = item.product;
      const quantity = Number(item.quantity || 1);
      const unitPrice = Number(product.sellingPrice || 0);
      total += unitPrice * quantity;
      const row = document.createElement("div");
      row.className = "cart-item";
      const image = document.createElement("img");
      image.className = "cart-item-image";
      image.src = product.imageUrl || "";
      image.alt = product.productName || "";
      const info = document.createElement("div");
      info.className = "cart-item-info";
      const name = document.createElement("div");
      name.className = "cart-item-name";
      name.textContent = product.productName || "";
      const price = document.createElement("div");
      price.className = "cart-item-price";
      price.textContent = "GH₵" + unitPrice.toFixed(2) + " each";
      const controls = document.createElement("div");
      controls.className = "quantity-controls";
      const minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "−";
      const qty = document.createElement("span");
      qty.textContent = quantity;
      const plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "remove-button";
      remove.textContent = "Remove";
      minus.addEventListener("click", function() {
        if (Number(item.quantity) > 1) item.quantity--;
        else cart.splice(index, 1);
        updateCartCount();
        renderCart();
      });
      plus.addEventListener("click", function() {
        item.quantity = Number(item.quantity || 0) + 1;
        updateCartCount();
        renderCart();
      });
      remove.addEventListener("click", function() {
        cart.splice(index, 1);
        updateCartCount();
        renderCart();
      });
      controls.appendChild(minus);
      controls.appendChild(qty);
      controls.appendChild(plus);
      info.appendChild(name);
      info.appendChild(price);
      info.appendChild(controls);
      info.appendChild(remove);
      row.appendChild(image);
      row.appendChild(info);
      container.appendChild(row);
    });
    document.getElementById("cartTotal").textContent = "GH₵" + total.toFixed(2);
  }

  document.getElementById("checkoutButton").addEventListener("click", function() {
    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }
    showPage("checkoutPage");
  });

  document.getElementById("closeCheckout").addEventListener("click", goBack);

  document.getElementById("placeOrderButton").addEventListener("click", async function() {
    const button = this;
    const customerName = document.getElementById("customerName").value.trim();
    const customerPhone = document.getElementById("customerPhone").value.trim();
    const deliveryAddress = document.getElementById("deliveryAddress").value.trim();
    const orderNotes = document.getElementById("orderNotes").value.trim();

    if (!customerName) { alert("Please enter your full name."); return; }
    if (!customerPhone) { alert("Please enter your phone number."); return; }
    if (!deliveryAddress) { alert("Please enter your delivery location."); return; }
    if (!Array.isArray(cart) || cart.length === 0) { alert("Your cart is empty."); return; }

    button.disabled = true;
    button.textContent = "Processing Order...";

    try {
      const response = await fetch("/api?action=order", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          customerName:customerName,
          customerPhone:customerPhone,
          deliveryAddress:deliveryAddress,
          orderNotes:orderNotes,
          cart:cart
        })
      });

      if (!response.ok) throw new Error("HTTP " + response.status);
      const result = await response.json();
      if (!result.success) throw new Error(result.error || "Unable to place order.");

      document.getElementById("successOrderId").textContent = result.data.orderId;
      document.getElementById("successOrderTotal").textContent =
        "GH₵" + Number(result.data.totalAmount).toFixed(2);

      cart = [];
      document.getElementById("customerName").value = "";
      document.getElementById("customerPhone").value = "";
      document.getElementById("deliveryAddress").value = "";
      document.getElementById("orderNotes").value = "";

      setPage("successPage");
      history.replaceState({pageId:"successPage"}, "", "#successPage");
    } catch (error) {
      console.error("Order error:", error);
      alert("Unable to place order.\n\n" + error.message);
    } finally {
      button.disabled = false;
      button.textContent = "Place Order";
    }
  });

  document.getElementById("continueShoppingButton").addEventListener("click", function() {
    history.replaceState({pageId:"shopPage"}, "", "#shopPage");
    setPage("shopPage");
  });

  document.getElementById("searchInput").addEventListener("input", function() {
    const searchTerm = this.value.toLowerCase().trim();
    const filtered = allProducts.filter(function(product) {
      const name = String(product.productName || "").toLowerCase();
      const category = String(product.category || "").toLowerCase();
      const matchesSearch = name.includes(searchTerm) || category.includes(searchTerm);
      const matchesCategory = selectedCategory === "All" ||
        category.includes(selectedCategory.toLowerCase());
      return matchesSearch && matchesCategory;
    });
    displayProducts(filtered);
  });

  document.querySelectorAll(".category").forEach(function(button) {
    button.addEventListener("click", function() {
      document.querySelectorAll(".category").forEach(function(item) {
        item.classList.remove("active");
      });
      this.classList.add("active");
      selectedCategory = this.textContent.trim();
      const searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = allProducts.filter(function(product) {
        const name = String(product.productName || "").toLowerCase();
        const category = String(product.category || "").toLowerCase();
        const matchesSearch = name.includes(searchTerm) || category.includes(searchTerm);
        const matchesCategory = selectedCategory === "All" ||
          category.includes(selectedCategory.toLowerCase());
        return matchesSearch && matchesCategory;
      });
      displayProducts(filtered);
    });
  });

  tgReady();
  setPage("shopPage");
  loadProducts();
  updateCartCount();
</script>
</body>
</html>
