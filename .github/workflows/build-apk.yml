name: Build SWEET MART Admin Android Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p www
          rsync -a --exclude=www --exclude=.git --exclude=android --exclude=node_modules ./ www/
          cp admin.html www/index.html

      - name: Validate JavaScript before Android build
        run: |
          node --check admin-v2.js
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("admin.html", "utf8");
          const marker = "<script>\n(function(){";
          const startTag = html.indexOf(marker);
          const endTag = html.indexOf("</script>", startTag + marker.length);
          if (startTag < 0 || endTag < 0 || endTag <= startTag) throw new Error("Could not locate the main admin script.");
          const script = html.slice(startTag + "<script>\n".length, endTag);
          new Function(script);
          console.log("admin.html inline JavaScript syntax: OK");
          NODE

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare branded Android icon
        run: |
          mkdir -p assets
          cp sweet-mart-admin-icon-512.png assets/icon.png

      - name: Generate Android launcher icon from SWEET MART logo
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#ffffff" --iconBackgroundColorDark "#111111"

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Configure Android SDK and release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | awk '!/BEGIN CERTIFICATE|END CERTIFICATE/{printf "%s",$0}' | base64 --decode > app/sweet-mart-release.keystore
          test -s app/sweet-mart-release.keystore

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s+', s):
              s = s.replace(
                  "android {",
                  "android {\n    compileSdk 35",
                  1
              )

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("sweet-mart-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)

          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          s, count = re.subn(
              pattern,
              r"\1\n            signingConfig signingConfigs.release",
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not locate the Android release build type.")

          p.write_text(s)
          PY

          echo "=== Android app build.gradle ==="
          grep -n "compileSdk\|signingConfigs\|signingConfig signingConfigs.release" app/build.gradle

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sweet-mart-admin-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: sweet-mart-admin-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
